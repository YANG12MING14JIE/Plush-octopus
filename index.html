    gl.bufferData(gl.ARRAY_BUFFER, statData, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 3, gl.FLOAT, false, STA * 4, 0);
    gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 4, gl.FLOAT, false, STA * 4, 12);
    gl.enableVertexAttribArray(5); gl.vertexAttribPointer(5, 1, gl.FLOAT, false, STA * 4, 28);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.layerBuf);
    gl.enableVertexAttribArray(6); gl.vertexAttribPointer(6, 1, gl.FLOAT, false, 4, 0);
    gl.vertexAttribDivisor(6, 1);
    const ib = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, index, gl.STATIC_DRAW);
    gl.bindVertexArray(null);
    return { vao, dynBuf, count: index.length, data: dynData };
  }

  simpleMesh(m) {
    const gl = this.gl;
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const vb = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.bufferData(gl.ARRAY_BUFFER, m.data, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
    const ib = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, m.index, gl.STATIC_DRAW);
    gl.bindVertexArray(null);
    return { vao, count: m.index.length };
  }

  target(size, depth) {
    const gl = this.gl;
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, size, size, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    if (depth) {
      const rb = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
      gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, size, size);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rb);
    }
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('FRAMEBUFFER');
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fb, size };
  }

  upload(mesh) {
    const gl = this.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.dynBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, mesh.data);
  }

  // 陰影投影：俯視正交 + 沿主光方向輕微斜切（影子稍微偏離光源）
  buildShadowMat(cx, cz, sx, sz) {
    const m = this.shadowMat, h = SHADOW_HALF;
    m.fill(0);
    m[0] = 1 / h; m[4] = -sx / h; m[12] = -cx / h;
    m[5] = -sz / h; m[9] = 1 / h; m[13] = -cz / h;
    m[6] = 2 / SHADOW_HEIGHT; m[14] = -1;
    m[15] = 1;
    return m;
  }

  shadowPass(meshes, cx, cz, sx, sz) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.shA.fb);
    gl.viewport(0, 0, SHADOW_RES, SHADOW_RES);
    gl.clearColor(0, 0, 0, 1);
    gl.clearDepth(1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LESS);
    gl.depthMask(true);
    gl.disable(gl.CULL_FACE);
    gl.disable(gl.BLEND);
    const P = this.progShadow;
    gl.useProgram(P.p);
    gl.uniformMatrix4fv(P.u('uShadowMat'), false, this.buildShadowMat(cx, cz, sx, sz));
    gl.uniform1f(P.u('uHeight'), SHADOW_HEIGHT);
    for (const m of meshes) {
      gl.bindVertexArray(m.vao);
      gl.drawElements(gl.TRIANGLES, m.count, gl.UNSIGNED_SHORT, 0);
    }
    // 兩次可分離高斯模糊（先寬後窄）
    gl.disable(gl.DEPTH_TEST);
    const B = this.progBlur;
    gl.useProgram(B.p);
    gl.bindVertexArray(this.emptyVAO);
    gl.activeTexture(gl.TEXTURE0);
    gl.uniform1i(B.u('uTex'), 0);
    const px = 1 / SHADOW_RES;
    const passes = [[2.2, 0], [0, 2.2], [0.9, 0], [0, 0.9]];
    passes.forEach(([dx, dy], i) => {
      const src = i % 2 === 0 ? this.shA : this.shB;
      const dst = i % 2 === 0 ? this.shB : this.shA;
      gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
      gl.bindTexture(gl.TEXTURE_2D, src.tex);
      gl.uniform2f(B.u('uDir'), dx * px, dy * px);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    });
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // 眼睛的模型矩陣：位置 E、表面法線 z、頭部向上 up，三軸縮放
  eyeModel(E, z, up, sx, sy, sz) {
    let ux = up[0], uy = up[1], uz = up[2];
    const d = ux * z[0] + uy * z[1] + uz * z[2];
    ux -= z[0] * d; uy -= z[1] * d; uz -= z[2] * d;
    const l = Math.hypot(ux, uy, uz) || 1;
    ux /= l; uy /= l; uz /= l;
    const xx = uy * z[2] - uz * z[1], xy = uz * z[0] - ux * z[2], xz = ux * z[1] - uy * z[0];
    const m = this.model, n = this.nmat;
    m[0] = xx * sx; m[1] = xy * sx; m[2] = xz * sx; m[3] = 0;
    m[4] = ux * sy; m[5] = uy * sy; m[6] = uz * sy; m[7] = 0;
    m[8] = z[0] * sz; m[9] = z[1] * sz; m[10] = z[2] * sz; m[11] = 0;
    m[12] = E[0]; m[13] = E[1]; m[14] = E[2]; m[15] = 1;
    // 法線矩陣 = 逆轉置；正交基底下就是各軸除以縮放
    n[0] = xx / sx; n[1] = xy / sx; n[2] = xz / sx;
    n[3] = ux / sy; n[4] = uy / sy; n[5] = uz / sy;
    n[6] = z[0] / sz; n[7] = z[1] / sz; n[8] = z[2] / sz;
  }
}

function makeSphere(seg, ring) {
  const data = [], index = [];
  for (let j = 0; j <= ring; j++) {
    const v = j / ring, th = v * Math.PI;
    for (let i = 0; i <= seg; i++) {
      const u = i / seg, ph = u * Math.PI * 2;
      const x = Math.sin(th) * Math.cos(ph), y = Math.cos(th), z = Math.sin(th) * Math.sin(ph);
      data.push(x, y, z, x, y, z);
    }
  }
  for (let j = 0; j < ring; j++) {
    for (let i = 0; i < seg; i++) {
      const a = j * (seg + 1) + i, b = a + seg + 1;
      index.push(a, a + 1, b, a + 1, b + 1, b);
    }
  }
  return { data: new Float32Array(data), index: new Uint16Array(index) };
}

// 圓弧管（局部 xy 平面，∩ 形）：u0..u1 是弧的起訖（單位 π），yOff 讓弧置中
function makeArc(seg, tube, r, u0, u1, yOff) {
  const data = [], index = [];
  for (let i = 0; i <= seg; i++) {
    const u = (u0 + (i / seg) * (u1 - u0)) * Math.PI;
    const cu = Math.cos(u), su = Math.sin(u);
    for (let j = 0; j <= tube; j++) {
      const v = (j / tube) * Math.PI * 2, cv = Math.cos(v), sv = Math.sin(v);
      data.push(cu * (1 + r * cv), su * (1 + r * cv) - yOff, r * sv, cu * cv, su * cv, sv);
    }
  }
  for (let i = 0; i < seg; i++) {
    for (let j = 0; j < tube; j++) {
      const a = i * (tube + 1) + j, b = a + tube + 1;
      index.push(a, b, a + 1, a + 1, b, b + 1);
    }
  }
  return { data: new Float32Array(data), index: new Uint16Array(index) };
}


// ---------------------------------------------------------------------
// 7. 互動：相機、射線拾取、抓取／戳／梳毛、黏人觸手、音效
// ---------------------------------------------------------------------
const UP = [0, 1, 0];

function updateCamera() {
  const c = app.cam, w = app.viewW, h = app.viewH;
  const hc = app.head.c;
  // 視角目標慢慢跟著章魚（被拋起或拖走時不會跑出畫面）
  const k = 1 - Math.exp(-app.frameDt * 2.5);
  c.target[0] += (hc[0] * 0.75 - c.target[0]) * k;
  c.target[1] += (clamp(hc[1] * 0.55 + 0.15, 0.45, 2.2) - c.target[1]) * k;
  c.target[2] += (hc[2] * 0.75 - c.target[2]) * k;
  const tanH = Math.tan(c.fov / 2);
  const freeW = Math.max(200, w - app.layout.right);
  const freeH = Math.max(200, h - app.layout.bottom - app.layout.top);
  const fitW = (w < 720 ? 4.9 : 5.4) / (2 * tanH * (freeW / h));
  const fitH = 3.6 / (2 * tanH * (freeH / h));
  const dist = clamp(Math.max(fitW, fitH), 6.5, 24) * c.zoom;
  const cp = Math.cos(c.pitch);
  c.eye[0] = c.target[0] + dist * cp * Math.sin(c.yaw);
  c.eye[1] = c.target[1] + dist * Math.sin(c.pitch);
  c.eye[2] = c.target[2] + dist * cp * Math.cos(c.yaw);
  M4.lookAt(c.view, c.eye, c.target, UP);
  // 非對稱視錐：讓章魚落在「沒被面板擋住」的區域中央
  const n = 0.1, f = 80, top = n * tanH, right = top * (w / h);
  const sx = right * (app.layout.right / w);
  const sy = top * ((app.layout.bottom - app.layout.top) / h);
  c.n = n; c.l = -right + sx; c.r = right + sx; c.b = -top - sy; c.t = top - sy;
  M4.frustum(c.proj, c.l, c.r, c.b, c.t, n, f);
  M4.mul(c.viewProj, c.proj, c.view);
  // 相機基底（給射線用）
  const fx = c.target[0] - c.eye[0], fy = c.target[1] - c.eye[1], fz = c.target[2] - c.eye[2];
  const fl = Math.hypot(fx, fy, fz);
  c.fwd[0] = fx / fl; c.fwd[1] = fy / fl; c.fwd[2] = fz / fl;
  c.right[0] = c.view[0]; c.right[1] = c.view[4]; c.right[2] = c.view[8];
  c.up[0] = c.view[1]; c.up[1] = c.view[5]; c.up[2] = c.view[9];
}

// 螢幕座標 → 世界射線
function screenRay(px, py) {
  const c = app.cam, w = app.viewW, h = app.viewH;
  const xn = c.l + (c.r - c.l) * (px / w);
  const yn = c.t - (c.t - c.b) * (py / h);
  let dx = c.right[0] * xn + c.up[0] * yn + c.fwd[0] * c.n;
  let dy = c.right[1] * xn + c.up[1] * yn + c.fwd[1] * c.n;
  let dz = c.right[2] * xn + c.up[2] * yn + c.fwd[2] * c.n;
  const l = Math.hypot(dx, dy, dz);
  return { o: [c.eye[0], c.eye[1], c.eye[2]], d: [dx / l, dy / l, dz / l] };
}

const _bary = new Float32Array(3);
// 射線打章魚：頭部 5120 個三角形 + 觸手（先用包圍球篩）
function pick(ray) {
  const [ox, oy, oz] = ray.o, [dx, dy, dz] = ray.d;
  let best = null, bestT = Infinity;
  const hm = app.headMesh, hp = hm.pos, hi = hm.index, hc = app.head.c;
  {
    const ex = hc[0] - ox, ey = hc[1] - oy, ez = hc[2] - oz;
    const tc = ex * dx + ey * dy + ez * dz;
    const d2 = ex * ex + ey * ey + ez * ez - tc * tc;
    if (d2 < 1.6 * 1.6) {
      for (let f = 0; f < hi.length; f += 3) {
        const a = hi[f] * 3, b = hi[f + 1] * 3, c = hi[f + 2] * 3;
        const t = rayTri(ox, oy, oz, dx, dy, dz, hp[a], hp[a + 1], hp[a + 2], hp[b], hp[b + 1], hp[b + 2], hp[c], hp[c + 1], hp[c + 2], _bary);
        if (t > 0 && t < bestT) {
          bestT = t;
          best = { kind: 'head', t, n: interpNormal(hm.nor, hi[f], hi[f + 1], hi[f + 2]) };
        }
      }
    }
  }
  const tm = app.tentMesh, tp = tm.pos, ti = tm.index;
  const triPer = (TR - 1) * SIDES * 2;
  for (let k = 0; k < NT; k++) {
    const B = tm.bound;
    const ex = B[k * 4] - ox, ey = B[k * 4 + 1] - oy, ez = B[k * 4 + 2] - oz;
    const tc = ex * dx + ey * dy + ez * dz;
    if (ex * ex + ey * ey + ez * ez - tc * tc > B[k * 4 + 3] ** 2) continue;
    for (let f = k * triPer * 3; f < (k + 1) * triPer * 3; f += 3) {
      const a = ti[f] * 3, b = ti[f + 1] * 3, c = ti[f + 2] * 3;
      const t = rayTri(ox, oy, oz, dx, dy, dz, tp[a], tp[a + 1], tp[a + 2], tp[b], tp[b + 1], tp[b + 2], tp[c], tp[c + 1], tp[c + 2], _bary);
      if (t > 0 && t < bestT) {
        bestT = t;
        const v = ti[f] - k * TV;
        const ring = Math.floor(v / RV);
        const particle = ring >= RINGS - 1 ? NP - 1 : Math.round((ring / (RINGS - 1)) * (NP - 1));
        best = { kind: 'tent', t, k, ring, particle, n: interpNormal(tm.dyn, ti[f], ti[f + 1], ti[f + 2], DYN, 3) };
      }
    }
  }
  if (best) best.p = [ox + dx * bestT, oy + dy * bestT, oz + dz * bestT];
  return best;
}

function interpNormal(arr, a, b, c, stride = 3, off = 0) {
  const w = _bary;
  let nx = 0, ny = 0, nz = 0;
  [a, b, c].forEach((v, i) => {
    nx += arr[v * stride + off] * w[i];
    ny += arr[v * stride + off + 1] * w[i];
    nz += arr[v * stride + off + 2] * w[i];
  });
  const l = Math.hypot(nx, ny, nz) || 1;
  return [nx / l, ny / l, nz / l];
}

function rayPlane(ray, px, py, pz, nx, ny, nz) {
  const den = ray.d[0] * nx + ray.d[1] * ny + ray.d[2] * nz;
  if (Math.abs(den) < 1e-6) return null;
  const t = ((px - ray.o[0]) * nx + (py - ray.o[1]) * ny + (pz - ray.o[2]) * nz) / den;
  if (t <= 0) return null;
  return [ray.o[0] + ray.d[0] * t, ray.o[1] + ray.d[1] * t, ray.o[2] + ray.d[2] * t];
}

// ---- 梳毛：把拖曳方向投影到表面切平面，寫進每個頂點的梳理向量 ----
function applyComb(hit, Dx, Dy, Dz) {
  const rad = 0.3, rad2 = rad * rad;
  const [hx, hy, hz] = hit.p;
  const hm = app.headMesh, pos = hm.pos, nor = hm.nor, cr = hm.combRest, rn = hm.restNor, R = app.head.R;
  for (let v = 0; v < hm.n; v++) {
    const k = v * 3;
    const ex = pos[k] - hx, ey = pos[k + 1] - hy, ez = pos[k + 2] - hz;
    const d2 = ex * ex + ey * ey + ez * ez;
    if (d2 >= rad2) continue;
    const w = Math.min(1, (1 - d2 / rad2) ** 2 * 0.9);
    const nd = Dx * nor[k] + Dy * nor[k + 1] + Dz * nor[k + 2];
    let tx = Dx - nor[k] * nd, ty = Dy - nor[k + 1] * nd, tz = Dz - nor[k + 2] * nd;
    // 世界 → 頭部靜止座標（乘 Rᵀ）
    let rx = R[0] * tx + R[3] * ty + R[6] * tz;
    let ry = R[1] * tx + R[4] * ty + R[7] * tz;
    let rz = R[2] * tx + R[5] * ty + R[8] * tz;
    const rd = rx * rn[k] + ry * rn[k + 1] + rz * rn[k + 2];
    rx -= rn[k] * rd; ry -= rn[k + 1] * rd; rz -= rn[k + 2] * rd;
    const l = Math.hypot(rx, ry, rz);
    if (l < 1e-6) continue;
    cr[k] += (rx / l - cr[k]) * w;
    cr[k + 1] += (ry / l - cr[k + 1]) * w;
    cr[k + 2] += (rz / l - cr[k + 2]) * w;
  }
  const tm = app.tentMesh, tp = tm.pos, comb = tm.comb;
  for (let k = 0; k < NT; k++) {
    const B = tm.bound;
    if (Math.hypot(B[k * 4] - hx, B[k * 4 + 1] - hy, B[k * 4 + 2] - hz) > B[k * 4 + 3] + rad) continue;
    for (let j = 0; j < TR; j++) {
      const o = (k * TR + j) * 3;
      for (let s = 0; s < RV; s++) {
        const v = k * TV + j * RV + s, p = v * 3;
        const ex = tp[p] - hx, ey = tp[p + 1] - hy, ez = tp[p + 2] - hz;
        const d2 = ex * ex + ey * ey + ez * ez;
        if (d2 >= rad2) continue;
        const w = Math.min(1, (1 - d2 / rad2) ** 2 * 0.9);
        const ph = (s / SIDES) * Math.PI * 2, cp = Math.cos(ph), sp = Math.sin(ph);
        let ax = -tm.ringN[o] * sp * FLAT + tm.ringB[o] * cp;
        let ay = -tm.ringN[o + 1] * sp * FLAT + tm.ringB[o + 1] * cp;
        let az = -tm.ringN[o + 2] * sp * FLAT + tm.ringB[o + 2] * cp;
        const al = Math.hypot(ax, ay, az) || 1;
        const a = Dx * tm.ringT[o] + Dy * tm.ringT[o + 1] + Dz * tm.ringT[o + 2];
        const b = (Dx * ax + Dy * ay + Dz * az) / al;
        const l = Math.hypot(a, b);
        if (l < 1e-6) continue;
        comb[v * 2] += (a / l - comb[v * 2]) * w;
        comb[v * 2 + 1] += (b / l - comb[v * 2 + 1]) * w;
      }
    }
  }
}

// ---- 音效（WebAudio 即時合成，沒有音檔）----
const audio = { ctx: null, out: null, noise: null, lastSquish: 0 };
function ensureAudio() {
  if (!P.sound) return;
  if (audio.ctx) {
    if (audio.ctx.state === 'suspended') audio.ctx.resume().catch(() => {});
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    audio.ctx = new AC();
    if (audio.ctx.state === 'suspended') audio.ctx.resume().catch(() => {});
    audio.out = audio.ctx.createGain();
    audio.out.gain.value = 0.45;
    audio.out.connect(audio.ctx.destination);
    const len = Math.floor(audio.ctx.sampleRate * 0.3);
    audio.noise = audio.ctx.createBuffer(1, len, audio.ctx.sampleRate);
    const ch = audio.noise.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  } catch (e) {
    audio.ctx = null;
  }
}
function tone(f0, f1, dur, gain, type = 'sine') {
  if (!P.sound || !audio.ctx || audio.ctx.state !== 'running') return;
  const t = audio.ctx.currentTime;
  const o = audio.ctx.createOscillator(), g = audio.ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.out);
  o.start(t);
  o.stop(t + dur + 0.03);
}
function hiss(dur, gain, freq) {
  if (!P.sound || !audio.ctx || audio.ctx.state !== 'running') return;
  const t = audio.ctx.currentTime;
  const s = audio.ctx.createBufferSource(), f = audio.ctx.createBiquadFilter(), g = audio.ctx.createGain();
  s.buffer = audio.noise;
  f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(audio.out);
  s.start(t);
  s.stop(t + dur + 0.02);
}
const sfx = {
  pop() { tone(760, 150, 0.11, 0.32); hiss(0.05, 0.12, 1900); },
  plip() { tone(820, 1380, 0.07, 0.16); },
  boop() { tone(420, 250, 0.13, 0.24, 'triangle'); },
  squish(v) {
    const now = performance.now();
    if (now - audio.lastSquish < 280) return;
    audio.lastSquish = now;
    const g = Math.min(0.32, 0.04 * v);
    hiss(0.16, g, 520);
    tone(180, 85, 0.16, g * 0.9);
  },
};

// ---- 黏人模式：最近的兩隻觸手伸向游標，碰到就吸住，拉太遠「啵」一聲彈開 ----
function updateClingy(dt) {
  const tents = app.tents, ptr = app.hover;
  let C = null;
  if (P.clingy && ptr.active && app.drag.mode === 'none') {
    const ray = screenRay(ptr.x, ptr.y);
    C = rayPlane(ray, 0, 0.3, 0, 0, 1, 0);
    if (C) {
      C[0] = clamp(C[0], -BOUNDS + 0.2, BOUNDS - 0.2);
      C[2] = clamp(C[2], -BOUNDS + 0.2, BOUNDS - 0.2);
    }
  }
  app.cling = C;
  const tip = (NP - 1) * 3;
  const cand = [];
  for (const t of tents) {
    t.cooldown = Math.max(0, t.cooldown - dt);
    t._dTip = Infinity; t._dRoot = Infinity;
    if (!C) continue;
    t._dTip = Math.hypot(t.x[tip] - C[0], t.x[tip + 1] - C[1], t.x[tip + 2] - C[2]);
    t._dRoot = Math.hypot(t.x[0] - C[0], t.x[1] - C[1], t.x[2] - C[2]);
    // 游標停在頭上時不發起新的「伸手」（不然觸手會伸到頭底下去抓自己）
    if (app.hover.kind !== 'head' && t.cooldown <= 0 && t.grab < 0 && t._dRoot < t.L * 1.12 && t._dTip < 1.7) cand.push(t);
  }
  cand.sort((a, b) => a._dTip - b._dTip);
  const chosen = new Set(cand.slice(0, 2));
  for (const t of tents) {
    if (t.attached) {
      if (!C || t._dRoot > t.L * 1.32) {
        t.detach(1.3);
        sfx.pop();
      } else {
        const kk = Math.min(1, dt * 18);
        t.reachTarget[0] += (C[0] - t.reachTarget[0]) * kk;
        t.reachTarget[1] += (C[1] - t.reachTarget[1]) * kk;
        t.reachTarget[2] += (C[2] - t.reachTarget[2]) * kk;
        t.reach = 1;
      }
      continue;
    }
    t.reach = chosen.has(t) ? Math.min(1, t.reach + dt * 1.8) : Math.max(0, t.reach - dt * 1.4);
    if (chosen.has(t) && t.reach > 0.5 && t._dTip < 0.26) {
      t.attach(C[0], C[1], C[2]);
      sfx.plip();
      hint('cling', '被黏住了！把游標拉遠一點就能甩開');
    }
  }
}

// 每個子步驟：伸向游標的觸手尖端受到拉力，頭往游標方向傾
function applyClingForces(dt) {
  const C = app.cling;
  if (!C) return;
  let lean = 0;
  for (const t of app.tents) {
    if (t.attached || t.reach <= 0) continue;
    lean = Math.max(lean, t.reach);
    const pull = 16 * t.reach * dt;
    for (let i = NP - 3; i < NP; i++) {
      const s = pull * (i - (NP - 4)) / 3, k = i * 3;
      t.v[k] += (C[0] - t.x[k]) * s;
      t.v[k + 1] += (C[1] + 0.15 - t.x[k + 1]) * s;
      t.v[k + 2] += (C[2] - t.x[k + 2]) * s;
    }
  }
  for (const t of app.tents) if (t.attached) lean = 1;
  if (lean > 0) {
    const hc = app.head.c;
    const dx = C[0] - hc[0], dz = C[2] - hc[2], l = Math.hypot(dx, dz);
    if (l > 0.3) app.head.lean(dx / l, dz / l, 2.2 * lean, dt);
  }
}

// ---- 指標事件 ----
function setupPointer(canvas) {
  const ptrs = new Map();
  const drag = app.drag;
  const local = (e) => {
    const r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  };
  const releaseAll = () => {
    app.head.grabbing = false;
    for (const t of app.tents) if (t.grab >= 0) t.release();
  };
  const detachAll = (sound) => {
    let any = false;
    for (const t of app.tents) if (t.attached) { t.detach(0.8); any = true; }
    if (any && sound) sfx.pop();
  };

  canvas.addEventListener('pointerdown', (e) => {
    ensureAudio();
    const [x, y] = local(e);
    ptrs.set(e.pointerId, [x, y]);
    canvas.setPointerCapture(e.pointerId);
    app.interacted = true;
    if (ptrs.size === 2) {
      releaseAll();
      const [a, b] = [...ptrs.values()];
      drag.mode = 'pinch';
      drag.pinch = Math.hypot(a[0] - b[0], a[1] - b[1]);
      return;
    }
    if (ptrs.size > 2) return;
    detachAll(true);
    const ray = screenRay(x, y);
    const hit = pick(ray);
    drag.x0 = x; drag.y0 = y; drag.lx = x; drag.ly = y; drag.t0 = performance.now(); drag.moved = false;
    drag.vyaw = 0; drag.vpitch = 0;
    const comb = P.tool === 'comb' || e.shiftKey;
    if (hit && comb) {
      drag.mode = 'comb';
      drag.last = hit.p;
      hint('comb', '順著同一個方向刷，毛會倒下、留下梳痕');
    } else if (hit) {
      drag.mode = 'grab';
      drag.hit = hit;
      drag.plane = [hit.p[0], hit.p[1], hit.p[2]];
      if (hit.kind === 'head') app.head.startGrab(hit.p[0], hit.p[1], hit.p[2]);
      else app.tents[hit.k].startGrab(hit.particle, hit.p[0], hit.p[1], hit.p[2]);
    } else {
      drag.mode = 'orbit';
    }
    updateCursor(e);
  });

  window.addEventListener('pointermove', (e) => {
    const onCanvas = e.target === canvas || ptrs.has(e.pointerId);
    const [x, y] = local(e);
    if (e.pointerType !== 'touch') {
      app.hover.active = onCanvas && drag.mode === 'none';
      app.hover.x = x; app.hover.y = y;
    }
    if (!ptrs.has(e.pointerId)) { if (onCanvas) app.hover.pending = true; updateCursor(e); return; }
    ptrs.set(e.pointerId, [x, y]);
    if (drag.mode === 'pinch' && ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (drag.pinch > 0) app.cam.zoom = clamp(app.cam.zoom * (drag.pinch / d), 0.45, 1.8);
      drag.pinch = d;
      return;
    }
    const dx = x - drag.lx, dy = y - drag.ly;
    if (Math.hypot(x - drag.x0, y - drag.y0) > 6) drag.moved = true;
    drag.lx = x; drag.ly = y;
    drag.tMove = performance.now();
    if (drag.mode === 'orbit') {
      app.cam.yaw -= dx * 0.006;
      app.cam.pitch = clamp(app.cam.pitch + dy * 0.004, 0.06, 1.25);
      drag.vyaw = -dx * 0.006; drag.vpitch = dy * 0.004;
    } else if (drag.mode === 'grab') {
      const f = app.cam.fwd, p = drag.plane;
      const G = rayPlane(screenRay(x, y), p[0], p[1], p[2], f[0], f[1], f[2]);
      if (G) {
        G[1] = clamp(G[1], 0.05, CEILING - 0.5);
        G[0] = clamp(G[0], -BOUNDS + 0.3, BOUNDS - 0.3);
        G[2] = clamp(G[2], -BOUNDS + 0.3, BOUNDS - 0.3);
        if (drag.hit.kind === 'head') app.head.grabTarget.set(G);
        else app.tents[drag.hit.k].grabTarget.set(G);
      }
    } else if (drag.mode === 'comb') {
      drag.combX = x; drag.combY = y; drag.combPending = true;
    }
  });

  const end = (e) => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (drag.mode === 'grab') {
      const quick = !drag.moved && performance.now() - drag.t0 < 320;
      releaseAll();
      if (drag.moved) app.wantFace = true;
      if (quick) {
        const h = drag.hit;
        if (h.kind === 'head') app.head.poke(h.p[0], h.p[1], h.p[2], h.n[0], h.n[1], h.n[2], 3.2);
        else app.tents[h.k].flick(h.particle, 3.4);
        sfx.boop();
        app.happy = Math.max(app.happy, 0.6);
      }
    }
    // 放開前停住超過 80 ms 就不要慣性旋轉
    if (drag.mode === 'orbit' && performance.now() - (drag.tMove || 0) > 80) { drag.vyaw = 0; drag.vpitch = 0; }
    if (drag.mode === 'pinch' && ptrs.size > 0) { drag.mode = 'none'; return; }
    if (ptrs.size === 0) drag.mode = 'none';
    updateCursor(e);
  };
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  canvas.addEventListener('pointerleave', (e) => {
    if (e.pointerType !== 'touch' && !ptrs.has(e.pointerId)) app.hover.active = false;
  });
  window.addEventListener('pointerout', (e) => { if (!e.relatedTarget) app.hover.active = false; });
  window.addEventListener('blur', () => { app.hover.active = false; });

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    app.cam.zoom = clamp(app.cam.zoom * Math.exp(e.deltaY * 0.0012), 0.45, 1.8);
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    const tg = e.target;
    const typing = tg && (tg.tagName === 'TEXTAREA' || tg.isContentEditable ||
      (tg.tagName === 'INPUT' && !['range', 'checkbox', 'radio', 'button'].includes(tg.type)));
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Shift') canvas.classList.add('is-comb');
    const k = e.key.toLowerCase();
    if (k === 't') { ensureAudio(); toss(); }
    else if (k === 'r') resetScene();
    else if (k === 'c') setTool(P.tool === 'comb' ? 'grab' : 'comb');
  });
  window.addEventListener('keyup', (e) => { if (e.key === 'Shift') updateCursor(e); });

  function updateCursor(e) {
    const cl = canvas.classList;
    const comb = P.tool === 'comb' || (e && e.shiftKey);
    cl.toggle('is-comb', comb);
    cl.toggle('is-drag', !comb && (drag.mode === 'grab' || drag.mode === 'orbit'));
    cl.toggle('is-hover', !comb && drag.mode === 'none' && app.hover.over);
  }
  app.updateCursor = updateCursor;
}

// 每幀處理：梳毛（節流到一幀一次）、懸停偵測、相機慣性
function frameInteraction(dt) {
  const drag = app.drag;
  if (drag.mode === 'comb' && drag.combPending) {
    drag.combPending = false;
    const hit = pick(screenRay(drag.combX, drag.combY));
    if (hit && drag.last) {
      const Dx = hit.p[0] - drag.last[0], Dy = hit.p[1] - drag.last[1], Dz = hit.p[2] - drag.last[2];
      const l = Math.hypot(Dx, Dy, Dz);
      if (l > 0.004) {
        applyComb(hit, Dx / l, Dy / l, Dz / l);
        drag.last = hit.p;
        if (hit.kind === 'head') app.happy = 1;
      }
    } else {
      drag.last = hit ? hit.p : null;
    }
  }
  if (app.hover.pending) {
    app.hover.pending = false;
    const h = pick(screenRay(app.hover.x, app.hover.y));
    app.hover.over = !!h;
    app.hover.kind = h ? h.kind : null;
    if (app.updateCursor) app.updateCursor(null);
  }
  if (drag.mode === 'none') {
    const k = Math.exp(-dt * 5);
    drag.vyaw *= k; drag.vpitch *= k;
    app.cam.yaw += drag.vyaw;
    app.cam.pitch = clamp(app.cam.pitch + drag.vpitch, 0.06, 1.25);
  }
}

// 整隻章魚（頭 + 觸手）繞「通過頭部質心的單位軸」轉 angle（Rodrigues 公式）。
// 運動學修正：同時轉 x 與 x0 → 不會產生速度，也不會被地面摩擦或觸手的彈力抵銷
function rotateOctopus(ax, ay, az, angle) {
  const c = app.head.c, cs = Math.cos(angle), sn = Math.sin(angle), t = 1 - cs;
  const m = [
    cs + ax * ax * t, ax * ay * t - az * sn, ax * az * t + ay * sn,
    ay * ax * t + az * sn, cs + ay * ay * t, ay * az * t - ax * sn,
    az * ax * t - ay * sn, az * ay * t + ax * sn, cs + az * az * t,
  ];
  const rot = (arr) => {
    for (let k = 0; k < arr.length; k += 3) {
      const dx = arr[k] - c[0], dy = arr[k + 1] - c[1], dz = arr[k + 2] - c[2];
      arr[k] = c[0] + m[0] * dx + m[1] * dy + m[2] * dz;
      arr[k + 1] = c[1] + m[3] * dx + m[4] * dy + m[5] * dz;
      arr[k + 2] = c[2] + m[6] * dx + m[7] * dy + m[8] * dz;
    }
  };
  rot(app.head.x); rot(app.head.x0);
  for (const tn of app.tents) { rot(tn.x); rot(tn.x0); }
}

// 落地靜止後：翻肚就自己翻回來；臉背對鏡頭就慢慢轉回來看你
function updateFacing(dt) {
  const h = app.head;
  const busy = h.grabbing || app.tents.some((t) => t.grab >= 0 || t.attached);
  // 「靜止」：沒被抓、質心幾乎不動、而且沒被舉高（平常是觸手撐著頭，頭不一定碰到地）
  const resting = !busy && h.c[1] < 1.35 && Math.hypot(h.vc[0], h.vc[1], h.vc[2]) < 0.5;
  if (!resting) { app.restT = 0; return; }
  app.restT += dt;
  const R = h.R;
  // (1) 翻正：頭的「上」= R·(0,1,0)，跟世界 y 軸夾角太大就繞水平軸轉回來
  const ux = R[1], uy = R[4], uz = R[7];
  if (!app.righting && uy < 0.5 && app.restT > 0.8) app.righting = true;
  if (app.righting) {
    const ang = Math.acos(clamp(uy, -1, 1));
    if (ang < 0.1) { app.righting = false; app.wantFace = true; return; }
    let ax = -uz, az = ux;
    const l = Math.hypot(ax, az);
    if (l < 1e-4) { ax = 1; az = 0; } else { ax /= l; az /= l; }
    rotateOctopus(ax, 0, az, Math.min(ang, 2.4 * dt));
    return;
  }
  // (2) 轉向鏡頭
  if (!app.wantFace || app.restT < 0.7) return;
  const fx = R[2], fz = R[8];   // 臉的方向 = R·(0,0,1)
  const dx = app.cam.eye[0] - h.c[0], dz = app.cam.eye[2] - h.c[2];
  let diff = Math.atan2(dx, dz) - Math.atan2(fx, fz);
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  if (Math.abs(diff) < 0.18) { app.wantFace = false; return; }
  rotateOctopus(0, 1, 0, clamp(diff, -1, 1) * 1.8 * dt);
}

// 拋起來：整隻往上 + 隨機旋轉
function toss() {
  const rnd = Math.random;
  const vx = (rnd() - 0.5) * 1.6, vz = (rnd() - 0.5) * 1.6;
  app.head.grabbing = false;
  for (const t of app.tents) { if (t.attached) t.detach(1.5); t.release(); }
  app.head.kick(vx, 6.8, vz, (rnd() - 0.5) * 5, (rnd() - 0.5) * 3, (rnd() - 0.5) * 5);
  for (const t of app.tents) t.kick(vx, 6.2, vz);
  app.wantFace = true;
  sfx.boop();
}

let hintShown = new Set(), hintTimer = 0;
function hint(key, text) {
  if (hintShown.has(key)) return;
  hintShown.add(key);
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => el.classList.remove('show'), 2600);
}


// ---------------------------------------------------------------------
// 8. 介面：面板、主題色、統計、自動畫質
// ---------------------------------------------------------------------
const P = {
  color: '#e9785d', belly: '#f6e3c8',
  furLen: 0.075, density: 95, fluff: 0.5, shells: 28,
  softness: 0.55, lively: 0.6, gravity: 1,
  tool: 'grab', clingy: true, sound: true, autoQ: true,
};
const REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (REDUCED_MOTION) P.lively = 0.2;

function hexToSrgb(hex) {
  const h = hex.trim().replace('#', '');
  const full = h.length === 3 ? h.split('').map((c) => c + c).join('') : h;
  const n = parseInt(full.slice(0, 6), 16);
  return new Float32Array([((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]);
}

function readTheme() {
  const cs = getComputedStyle(document.documentElement);
  const get = (name, fb) => {
    const v = cs.getPropertyValue(name).trim();
    return /^#[0-9a-f]{3,8}$/i.test(v) ? v : fb;
  };
  app.theme = {
    top: hexToSrgb(get('--gl-bg-top', '#e3ede9')),
    bottom: hexToSrgb(get('--gl-bg-bottom', '#c4d6d1')),
    shadow: hexToSrgb(get('--gl-shadow', '#2b4643')),
    sky: hexToLinear(get('--gl-sky', '#f2faf7')),
    ground: hexToLinear(get('--gl-ground', '#b3c7c1')),
  };
  app.theme.dark = app.theme.top[0] + app.theme.top[1] + app.theme.top[2] < 1.2;
}

function setColors() {
  app.colors.base = hexToLinear(P.color);
  app.colors.belly = hexToLinear(P.belly);
  document.documentElement.style.setProperty('--accent', P.color);
}

function applyPhysicsParams() {
  app.head.alpha = lerp(0.24, 0.035, P.softness);   // 越軟：往目標形狀拉得越少，晃得越久
  app.head.beta = lerp(0.12, 0.62, P.softness);     // 越軟：允許越多壓扁／拉長
}

function setTool(tool) {
  P.tool = tool;
  for (const b of document.querySelectorAll('.seg button')) {
    b.setAttribute('aria-checked', String(b.dataset.tool === tool));
  }
  if (app.updateCursor) app.updateCursor(null);
}

function bindUI() {
  const $ = (id) => document.getElementById(id);
  const fmt = {
    furLen: (v) => `${(v * 100).toFixed(1)} mm`,     // 1 單位 = 10 cm
    density: (v) => `${(v / 10).toFixed(1)} 根/cm`,
    fluff: (v) => `${Math.round(v * 100)}%`,
    shells: (v) => `${v} 層`,
    softness: (v) => `${Math.round(v * 100)}%`,
    lively: (v) => `${Math.round(v * 100)}%`,
    gravity: (v) => `${v.toFixed(1)} g`,
  };
  for (const id of Object.keys(fmt)) {
    const input = $(id), out = $(id + 'Out');
    input.value = String(P[id]);
    const sync = () => {
      const v = parseFloat(input.value);
      P[id] = v;
      out.textContent = fmt[id](v);
      const min = parseFloat(input.min), max = parseFloat(input.max);
      input.style.setProperty('--fill', `${((v - min) / (max - min)) * 100}%`);
      if (id === 'softness') applyPhysicsParams();
      if (id === 'shells') app.quality.shells = v;   // 使用者手動調整時，蓋過自動畫質的降級
    };
    input.addEventListener('input', sync);
    sync();
  }
  for (const sw of document.querySelectorAll('.sw')) {
    sw.addEventListener('click', () => {
      for (const o of document.querySelectorAll('.sw')) o.setAttribute('aria-checked', String(o === sw));
      P.color = sw.dataset.color;
      P.belly = sw.dataset.belly;
      setColors();
    });
  }
  for (const b of document.querySelectorAll('.seg button')) b.addEventListener('click', () => setTool(b.dataset.tool));
  for (const id of ['clingy', 'sound', 'autoQ']) {
    const el = $(id);
    el.checked = P[id];
    el.addEventListener('change', () => {
      P[id] = el.checked;
      if (id === 'sound' && el.checked) ensureAudio();
      if (id === 'autoQ' && !el.checked) { app.quality.dpr = 1; app.quality.shells = P.shells; }
    });
  }
  $('tossBtn').addEventListener('click', () => { ensureAudio(); toss(); });
  $('fluffBtn').addEventListener('click', () => { app.fluffAnim = 0.7; });
  $('resetBtn').addEventListener('click', () => resetScene());
  const panel = $('panel'), tog = $('panelToggle');
  tog.addEventListener('click', () => {
    const open = !panel.classList.contains('open');
    panel.classList.toggle('open', open);
    document.body.classList.toggle('panel-open', open);
    tog.setAttribute('aria-expanded', String(open));
    measureLayout();
  });
  if (REDUCED_MOTION) { $('lively').value = String(P.lively); $('lively').dispatchEvent(new Event('input')); }
}

// 面板擋住的範圍（px），相機用它把章魚擺在剩下空間的中央
function measureLayout() {
  const w = window.innerWidth;
  const panel = document.getElementById('panel');
  const intro = document.querySelector('.intro');
  if (w > 720) {
    const r = panel.getBoundingClientRect();
    app.layout.right = Math.min(w * 0.45, r.width + 24);
    app.layout.bottom = 0;
    app.layout.top = 0;
  } else {
    const r = panel.getBoundingClientRect();
    app.layout.right = 0;
    app.layout.bottom = Math.max(0, window.innerHeight - r.top);
    // 面板展開時標題會淡出，章魚可以用到上方空間
    const open = panel.classList.contains('open');
    app.layout.top = intro && !open ? Math.min(intro.getBoundingClientRect().bottom, window.innerHeight * 0.3) : 0;
  }
}

// 自動畫質：每 1.5 秒看一次平均幀時間，太慢先降解析度再降層數；穩定後慢慢升回去
function autoQuality(dt) {
  const q = app.quality;
  if (app.time < 2.5) return;   // 開頭幾秒在編譯著色器，不列入判斷
  q.acc += dt; q.frames++;
  if (q.acc < 1.5) return;
  const avg = q.acc / q.frames;
  q.acc = 0; q.frames = 0;
  q.cool = Math.max(0, q.cool - 1.5);
  if (!P.autoQ) return;
  if (avg > 0.024) {
    if (q.dpr > 0.6) q.dpr = Math.max(0.6, q.dpr - 0.15);
    else if (q.shells > 12) q.shells = Math.max(12, q.shells - 4);
    q.good = 0;
    q.cool = q.justRaised ? 30 : 6;
    q.justRaised = false;
  } else if (avg < 0.0185) {
    q.good++;
    q.justRaised = false;
    if (q.good >= 3 && q.cool <= 0) {
      if (q.dpr < 1) { q.dpr = Math.min(1, q.dpr + 0.15); q.justRaised = true; }
      else if (q.shells < P.shells) { q.shells = Math.min(P.shells, q.shells + 4); q.justRaised = true; }
      q.good = 0;
    }
  }
}

function updateStats(dt) {
  const s = app.stats;
  s.acc += dt; s.frames++;
  if (s.acc < 0.5) return;
  const fps = s.frames / s.acc;
  s.acc = 0; s.frames = 0;
  const shells = shellCount();
  const tris = (app.headMesh.nf + app.tentMesh.index.length / 3) * (shells + 1);
  const particles = app.head.n + NT * NP;
  const el = document.getElementById('stats');
  el.textContent =
    `${fps.toFixed(0).padStart(3)} fps · ${(1000 / fps).toFixed(1)} ms · WebGL2\n` +
    `${shells} 層毛殼 · ${(tris / 10000).toFixed(1)} 萬個三角形\n` +
    `${particles} 個物理粒子 · 解析度 ${app.dpr.toFixed(2)}×`;
}

function shellCount() {
  return Math.round(Math.min(P.shells, app.quality.shells));
}


// ---------------------------------------------------------------------
// 9. 主程式：固定步長物理（120 Hz 子步驟）＋ 每幀重建網格與繪製
// ---------------------------------------------------------------------
const SUB = 1 / 120, MAX_SUB = 4;
const norm3 = (v) => { const l = Math.hypot(v[0], v[1], v[2]); return new Float32Array([v[0] / l, v[1] / l, v[2] / l]); };
const KEY_DIR = norm3([-0.45, 0.85, 0.55]);   // 主光：左上前方
const FILL_DIR = norm3([0.8, 0.22, 0.3]);     // 補光：右側偏冷
const KEY_COL = new Float32Array([2.2, 2.08, 1.92]);
const FILL_COL = new Float32Array([0.3, 0.38, 0.46]);
const RIM_COL = new Float32Array([0.7, 0.78, 0.86]);
const MOUTH = hexToLinear('#4a2620');
const BLUSH = hexToLinear('#f48b8b');

const app = {
  cam: {
    yaw: 0, pitch: 0.42, zoom: 1, fov: (30 * Math.PI) / 180,
    target: [0, 0.6, 0], eye: [0, 3, 8],
    view: M4.create(), proj: M4.create(), viewProj: M4.create(),
    fwd: [0, 0, -1], right: [1, 0, 0], up: [0, 1, 0], n: 0.1, l: -1, r: 1, b: -1, t: 1,
  },
  layout: { right: 0, bottom: 0, top: 0 },
  drag: {
    mode: 'none', x0: 0, y0: 0, lx: 0, ly: 0, t0: 0, moved: false, vyaw: 0, vpitch: 0,
    hit: null, plane: null, last: null, pinch: 0, combX: 0, combY: 0, combPending: false,
  },
  hover: { active: false, x: 0, y: 0, pending: false, over: false, kind: null },
  quality: { dpr: 1, shells: P.shells, acc: 0, frames: 0, good: 0, cool: 0, justRaised: false },
  stats: { acc: 0, frames: 0 },
  colors: {},
  time: 0, simTime: 0, acc: 0, frameDt: 1 / 60, last: 0,
  happy: 0, blink: 1, blinkT: 2.5, blinkPhase: -1, fluffAnim: 0, wantFace: false, restT: 0, righting: false,
  dpr: 1, viewW: 1, viewH: 1, cling: null, silent: false, running: true,
};

function step(dt) {
  const head = app.head, tents = app.tents, g = 9.8 * P.gravity;
  app.simTime += dt;
  // 呼吸：靜止形狀微微放大縮小
  head.scale = 1 + 0.012 * Math.sin(app.simTime * 1.85) * (0.3 + P.lively);
  applyClingForces(dt);
  head.predict(dt, g);
  for (const t of tents) t.predict(dt, g);
  head.shapeMatch();
  const iters = 4;
  for (let it = 0; it < iters; it++) {
    const last = it === iters - 1;
    head.applyGrab(0.3);
    for (const t of tents) t.solve(head, last);
    if (it & 1) collideTentacles(tents);
    head.collide(last ? 0.55 : 0);
  }
  head.finish(dt);
  for (const t of tents) t.finish(dt);
  if (head.impact > 2.4 && !app.silent) sfx.squish(head.impact);
  head.impact = 0;
  // 保險：萬一數值爆掉（NaN），直接重置，不讓畫面壞掉
  if (!Number.isFinite(head.c[0] + head.c[1] + head.c[2]) && !app.silent) resetScene();
}

function resetScene() {
  app.silent = true;
  app.wantFace = false;
  app.righting = false;
  app.head.reset(0, 0);
  for (const t of app.tents) t.reset(app.head);
  app.headMesh.combRest.fill(0);
  app.tentMesh.comb.fill(0);
  // 先在背景模擬 2 秒，讓觸手自然攤平、尖端捲起來
  for (let i = 0; i < 240; i++) {
    for (const t of app.tents) t.animate(app.simTime, P.lively);
    step(SUB);
  }
  app.silent = false;
}

function resize() {
  const canvas = app.renderer.canvas;
  const w = canvas.clientWidth || window.innerWidth, h = canvas.clientHeight || window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 1.75) * app.quality.dpr;
  const W = Math.max(1, Math.round(w * dpr)), H = Math.max(1, Math.round(h * dpr));
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
  app.viewW = w; app.viewH = h; app.dpr = dpr;
}

function projectUv(p) {
  const m = app.cam.viewProj;
  const x = m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12];
  const y = m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13];
  const w = m[3] * p[0] + m[7] * p[1] + m[11] * p[2] + m[15];
  return [clamp(x / w * 0.5 + 0.5, -0.5, 1.5), clamp(y / w * 0.5 + 0.5, -0.5, 1.5)];
}

function render() {
  const R = app.renderer, gl = R.gl, cam = app.cam, th = app.theme, hc = app.head.c;
  R.upload(app.furHead);
  R.upload(app.furTent);

  // (1) 接觸陰影（對齊陰影貼圖的像素，移動時不閃爍）
  const texel = (2 * SHADOW_HALF) / SHADOW_RES;
  const cx = Math.round(hc[0] / texel) * texel, cz = Math.round(hc[2] / texel) * texel;
  const shear = 0.35;
  R.shadowPass([app.furHead, app.furTent], cx, cz, (KEY_DIR[0] / KEY_DIR[1]) * shear, (KEY_DIR[2] / KEY_DIR[1]) * shear);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, R.canvas.width, R.canvas.height);
  gl.clearColor(th.bottom[0], th.bottom[1], th.bottom[2], 1);
  gl.clearDepth(1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // (2) 攝影棚背景
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.disable(gl.CULL_FACE);
  gl.disable(gl.BLEND);
  let p = R.progBg;
  gl.useProgram(p.p);
  gl.uniform3fv(p.u('uTop'), th.top);
  gl.uniform3fv(p.u('uBottom'), th.bottom);
  gl.uniform2f(p.u('uRes'), R.canvas.width, R.canvas.height);
  const fu = projectUv(hc);
  gl.uniform2f(p.u('uFocus'), fu[0], fu[1]);
  gl.bindVertexArray(R.emptyVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // (3) 地板上的影子（乘法混合）
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.DST_COLOR, gl.ZERO);
  p = R.progFloor;
  gl.useProgram(p.p);
  gl.uniformMatrix4fv(p.u('uViewProj'), false, cam.viewProj);
  gl.uniform3f(p.u('uCenter'), cx, 0, cz);
  gl.uniform1f(p.u('uHalf'), SHADOW_HALF);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, R.shA.tex);
  gl.uniform1i(p.u('uTex'), 0);
  gl.uniform3fv(p.u('uShadowCol'), th.shadow);
  gl.uniform1f(p.u('uStrength'), th.dark ? 1.3 : 1.05);
  gl.bindVertexArray(R.quadVAO);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.disable(gl.BLEND);

  // (4) 毛：頭與觸手各一次 instanced draw，每次畫 (層數+1) 份
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.depthMask(true);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  if (R.samples > 0) gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  p = R.progFur;
  gl.useProgram(p.p);
  const shells = shellCount();
  gl.uniformMatrix4fv(p.u('uViewProj'), false, cam.viewProj);
  gl.uniform3fv(p.u('uCamPos'), cam.eye);
  gl.uniform1f(p.u('uShells'), shells);
  gl.uniform1f(p.u('uFurLen'), P.furLen);
  gl.uniform1f(p.u('uFluff'), P.fluff);
  gl.uniform1f(p.u('uTime'), REDUCED_MOTION ? 0 : app.time);
  gl.uniform1f(p.u('uGrav'), 0.3 * P.gravity);
  gl.uniform1f(p.u('uDensity'), P.density);
  gl.uniform1f(p.u('uHappy'), app.happy);
  gl.uniform1f(p.u('uExposure'), th.dark ? 0.95 : 0.9);
  gl.uniform3fv(p.u('uBase'), app.colors.base);
  gl.uniform3fv(p.u('uBelly'), app.colors.belly);
  gl.uniform3fv(p.u('uMouth'), MOUTH);
  gl.uniform3fv(p.u('uBlush'), BLUSH);
  gl.uniform3fv(p.u('uKeyDir'), KEY_DIR);
  gl.uniform3fv(p.u('uKeyCol'), KEY_COL);
  gl.uniform3fv(p.u('uFillDir'), FILL_DIR);
  gl.uniform3fv(p.u('uFillCol'), FILL_COL);
  gl.uniform3fv(p.u('uRimCol'), RIM_COL);
  gl.uniform3fv(p.u('uSky'), th.sky);
  gl.uniform3fv(p.u('uGround'), th.ground);
  gl.uniform3fv(p.u('uHeadC'), hc);
  gl.uniform3fv(p.u('uEye0'), EYE_DIRS[0]);
  gl.uniform3fv(p.u('uEye1'), EYE_DIRS[1]);
  gl.uniform1i(p.u('uKind'), 0);
  gl.bindVertexArray(app.furHead.vao);
  gl.drawElementsInstanced(gl.TRIANGLES, app.furHead.count, gl.UNSIGNED_SHORT, 0, shells + 1);
  gl.uniform1i(p.u('uKind'), 1);
  gl.bindVertexArray(app.furTent.vao);
  gl.drawElementsInstanced(gl.TRIANGLES, app.furTent.count, gl.UNSIGNED_SHORT, 0, shells + 1);
  gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);

  // (5) 眼睛
  drawEyes();
  gl.bindVertexArray(null);
}

function drawEyes() {
  const R = app.renderer, gl = R.gl, p = R.progEye, hm = app.headMesh, Rm = app.head.R, th = app.theme;
  gl.useProgram(p.p);
  gl.uniformMatrix4fv(p.u('uViewProj'), false, app.cam.viewProj);
  gl.uniform3fv(p.u('uCamPos'), app.cam.eye);
  gl.uniform3fv(p.u('uKeyDir'), KEY_DIR);
  gl.uniform3fv(p.u('uKeyCol'), KEY_COL);
  gl.uniform3fv(p.u('uFillDir'), FILL_DIR);
  gl.uniform3fv(p.u('uSky'), th.sky);
  gl.uniform3fv(p.u('uGround'), th.ground);
  gl.uniform3fv(p.u('uMouth'), MOUTH);
  gl.uniform1f(p.u('uExposure'), th.dark ? 0.95 : 0.9);
  const up = [Rm[1], Rm[4], Rm[7]];   // 頭部的「上」= R·(0,1,0)
  const happy = app.happy > 0.35;
  const mesh = happy ? R.arc : R.sphere;
  gl.uniform1i(p.u('uMode'), happy ? 1 : 0);
  gl.bindVertexArray(mesh.vao);
  for (const idx of hm.eyeIdx) {
    const k = idx * 3;
    const n = [hm.nor[k], hm.nor[k + 1], hm.nor[k + 2]];
    const lift = happy ? P.furLen * 0.9 + 0.012 : 0.035;
    const E = [hm.pos[k] + n[0] * lift, hm.pos[k + 1] + n[1] * lift, hm.pos[k + 2] + n[2] * lift];
    if (happy) R.eyeModel(E, n, up, 0.085, 0.085, 0.085);
    else R.eyeModel(E, n, up, 0.105, 0.105 * app.blink, 0.105);
    gl.uniformMatrix4fv(p.u('uModel'), false, R.model);
    gl.uniformMatrix3fv(p.u('uNormalMat'), false, R.nmat);
    gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
  }
  // 刺繡嘴巴：浮在毛尖上的細線；把「上」反過來 = 繞法線轉 180°，∩ 變成 ∪
  const k = hm.mouthIdx * 3;
  const n = [hm.nor[k], hm.nor[k + 1], hm.nor[k + 2]];
  const lift = P.furLen * 0.75 + 0.008;
  const E = [hm.pos[k] + n[0] * lift, hm.pos[k + 1] + n[1] * lift, hm.pos[k + 2] + n[2] * lift];
  const s = 0.07 + 0.02 * Math.min(1, app.happy * 1.5);
  R.eyeModel(E, n, [-up[0], -up[1], -up[2]], s, s * (0.9 + 0.3 * Math.min(1, app.happy)), s);
  gl.uniform1i(p.u('uMode'), 1);
  gl.uniformMatrix4fv(p.u('uModel'), false, R.model);
  gl.uniformMatrix3fv(p.u('uNormalMat'), false, R.nmat);
  gl.bindVertexArray(R.mouth.vao);
  gl.drawElements(gl.TRIANGLES, R.mouth.count, gl.UNSIGNED_SHORT, 0);
}

function updateFace(dt) {
  // 眨眼：每 2.5～6.5 秒一次，閉眼約 0.16 秒
  if (app.blinkPhase >= 0) {
    app.blinkPhase += dt;
    const t = app.blinkPhase / 0.16;
    app.blink = t >= 1 ? 1 : 1 - Math.sin(t * Math.PI) * 0.92;
    if (t >= 1) app.blinkPhase = -1;
  } else {
    app.blinkT -= dt;
    if (app.blinkT <= 0) { app.blinkPhase = 0; app.blinkT = 2.5 + Math.random() * 4; }
  }
  const combingHead = app.drag.mode === 'comb' && app.happy >= 1;
  if (!combingHead) app.happy = Math.max(0, app.happy - dt * 0.7);
  // 「弄蓬毛」：梳痕在 0.7 秒內慢慢消失
  if (app.fluffAnim > 0) {
    app.fluffAnim -= dt;
    const k = app.fluffAnim > 0 ? Math.exp(-dt * 7) : 0;
    const a = app.headMesh.combRest, b = app.tentMesh.comb;
    for (let i = 0; i < a.length; i++) a[i] *= k;
    for (let i = 0; i < b.length; i++) b[i] *= k;
  }
}

function frame(now) {
  if (!app.running) return;
  try {
    const dt = Math.min(0.05, Math.max(0.001, (now - app.last) / 1000));
    app.last = now;
    app.frameDt = dt;
    app.time += dt;
    frameInteraction(dt);
    updateClingy(dt);
    for (const t of app.tents) t.animate(app.simTime, P.lively);
    app.acc += dt;
    let n = 0;
    while (app.acc >= SUB && n < MAX_SUB) { step(SUB); app.acc -= SUB; n++; }
    if (n >= MAX_SUB) app.acc = 0;
    updateFace(dt);
    updateFacing(dt);
    app.headMesh.update(app.head);
    app.tentMesh.update(app.tents);
    resize();
    updateCamera();
    render();
    autoQuality(dt);
    updateStats(dt);
  } catch (err) {
    app.running = false;
    showFallback(err);
    return;
  }
  requestAnimationFrame(frame);
}

function showFallback(err) {
  console.error(err);
  const msg = document.getElementById('fallbackMsg');
  if (err && err.message === 'CONTEXT_LOST') {
    msg.textContent = '顯示卡暫時中斷了連線，重新整理頁面就能把章魚叫回來。';
  } else if (err && err.message !== 'NO_WEBGL2') {
    msg.textContent = `章魚載入時出錯了（${err.message}）。請重新整理，或改用新版的 Chrome、Edge、Safari、Firefox。`;
  }
  document.getElementById('fallback').hidden = false;
}

function init() {
  const canvas = document.getElementById('scene');
  try {
    app.renderer = new Renderer(canvas);
  } catch (err) {
    showFallback(err);
    return;
  }
  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    app.running = false;
    showFallback(new Error('CONTEXT_LOST'));
  });
  const rnd = makeRng(20261007);
  app.head = new SoftHead();
  app.tents = [];
  for (let k = 0; k < NT; k++) app.tents.push(new Tentacle(k, app.head, rnd));
  app.headMesh = new HeadMesh(app.head);
  app.tentMesh = new TentacleMesh(app.tents);
  app.furHead = app.renderer.furMesh(app.headMesh.dyn, app.headMesh.stat, app.headMesh.index);
  app.furTent = app.renderer.furMesh(app.tentMesh.dyn, app.tentMesh.stat, app.tentMesh.index);
  readTheme();
  setColors();
  bindUI();
  applyPhysicsParams();
  setupPointer(canvas);
  measureLayout();
  window.addEventListener('resize', measureLayout);
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  if (mq && mq.addEventListener) mq.addEventListener('change', readTheme);
  new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureLayout).catch(() => {});
  resetScene();
  app.last = performance.now();
  // 給自動化測試用的掛鉤（不影響一般使用）
  window.__octo = {
    app, P, step, render, pick, screenRay, applyComb, toss, resetScene, setTool, rotateOctopus,
    simulate(n) {
      for (let i = 0; i < n; i++) {
        for (const t of app.tents) t.animate(app.simTime, P.lively);
        step(SUB);
      }
    },
    // 不畫圖、只推進邏輯與物理（測試用，固定 60 fps）
    advance(sec) {
      const n = Math.max(1, Math.round(sec * 60)), dt = 1 / 60;
      for (let i = 0; i < n; i++) {
        app.frameDt = dt;
        app.time += dt;
        frameInteraction(dt);
        updateClingy(dt);
        for (const t of app.tents) t.animate(app.simTime, P.lively);
        step(SUB);
        step(SUB);
        updateFace(dt);
        updateFacing(dt);
        app.headMesh.update(app.head);
        app.tentMesh.update(app.tents);
        updateCamera();
      }
    },
    resume() {
      if (app.running) return;
      app.running = true;
      app.last = performance.now();
      requestAnimationFrame(frame);
    },
    project(p) {
      const m = app.cam.viewProj;
      const x = m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12];
      const y = m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13];
      const w = m[3] * p[0] + m[7] * p[1] + m[11] * p[2] + m[15];
      return [(x / w * 0.5 + 0.5) * app.viewW, (1 - (y / w * 0.5 + 0.5)) * app.viewH];
    },
    frameOnce() {
      updateFace(0);
      app.headMesh.update(app.head);
      app.tentMesh.update(app.tents);
      resize();
      measureLayout();
      updateCamera();
      render();
    },
  };
  requestAnimationFrame(frame);
}

init();

</script>
</body>
